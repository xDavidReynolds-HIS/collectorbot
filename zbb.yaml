name: "@zerobias-org/collectorbot"
version: "1.0.0"

# ── Shared dev credentials — inherited, not redeclared ───────────────
# ZB_TOKEN / ZB_API_KEY / ZB_ORG_ID / ZB_PLATFORM_URL / KNOWLEDGE_MCP_URL /
# NPM_CONFIG_TAG live ONCE per slot on the shared `dev` stack
# (@zerobias-org/dev-stack, auto-pulled from the registry at
# `zbb stack add`) and are IMPORTED here — the same depends/imports
# pattern vendor / suite / product / framework use.
# ⚠ Never `env set` these six on THIS stack: a per-stack override
# permanently shadows the import, so credential rotation on the dev
# stack stops propagating here (zbb never clobbers user overrides).
depends:
  dev:
    package: "@zerobias-org/dev-stack@^1.0.0"

imports:
  dev:
    optional: true
    vars:
      - ZB_TOKEN
      - ZB_API_KEY
      - ZB_ORG_ID
      - ZB_PLATFORM_URL
      - KNOWLEDGE_MCP_URL
      - NPM_CONFIG_TAG

env:
  DATALOADER_SERVICE_URL:
    type: string
    default: "https://app.zerobias.com/api/dataloader"
    description: >-
      Dataloader endpoint for the GATE's Neon step (separate from
      ZB_PLATFORM_URL — the gate does not honor that var). LEAVE ON THE
      PROD DEFAULT even for non-prod org targets: the step auths with the
      prod-issued ZB_TOKEN, and a per-env override makes that key 401.
      The org load never reads this (it uses ZB_PLATFORM_URL + ZB_API_KEY).

  AWS_ACCESS_KEY_ID:
    source: vault
    vault: "aws-auth/tools/ecr/creds/ecr-push.access_key"
    refresh: true

  AWS_SECRET_ACCESS_KEY:
    source: vault
    vault: "aws-auth/tools/ecr/creds/ecr-push.secret_key"
    refresh: true
    mask: true

  ECR_REGISTRY:
    type: string
    default: "961260934100.dkr.ecr.us-east-1.amazonaws.com"
    description: ECR registry URL for Docker image publishing

  GHCR_REGISTRY:
    type: string
    default: "ghcr.io/zerobias-org"
    description: GHCR registry URL for Docker image publishing

  AWS_REGION:
    type: string
    default: "us-east-1"
    description: AWS region for ECR operations

  # Neon database — ephemeral branches for dataloader testing
  NEON_API_KEY:
    source: vault
    vault: "operations-kv/neon/content.api-key"
    mask: true

  NEON_PROJECT_ID:
    source: vault
    vault: "operations-kv/neon/content.project-id"

  NEON_PARENT_BRANCH:
    type: string
    default: "content-master"
    description: Neon parent branch to create test branches from

  NEON_DB_ROLE:
    type: string
    default: "neondb_owner"
    description: Neon database role

  NEON_DB_NAME:
    type: string
    default: "zerobias"
    description: Neon database name

# ── Lifecycle ────────────────────────────────────────────────────────
lifecycle:
  clean:       ./gradlew clean
  build:       ./gradlew build
  test:
    command: ./gradlew test
    tools: [dataloader]
  gate:
    command: ./gradlew gate
    tools: [dataloader]
  gateCheck:   ./gradlew gateCheck
  version:     ./gradlew versionStandardPackages
  publish:     ./gradlew publish
  # Org-first SDLC: publish an org-private rc + queue the org dataloader
  # job. The -PorgPublish=true flag is what flips the shared publish
  # pipeline into org mode — zbb does not inject it on its own, and the
  # zb.base `publishOrg` alias reads the flag at CONFIGURATION time, so
  # without this entry zbb falls back to a bare `./gradlew publishOrg`
  # that hard-fails.
  publishOrg: ./gradlew publishOrg -PorgPublish=true
  buildImage:  ./gradlew buildImage

# ── Tools registry — referenced by lifecycle.<cmd>.tools ─────────────
tools:
  dataloader:
    check: "dataloader --version 2>&1"
    parse: "Dataloader v(\\S+)"
    version: ">=1.0.87"
    install: "npm i -g @zerobias-com/platform-dataloader"
