name: Publish

on:
  push:
    branches: [main, qa, dev, uat]
    paths:
      - 'package/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:
    inputs:
      module:
        description: 'Collectorbot to publish (e.g. avigilon/alta/access). Leave blank for all changed.'
        required: false

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish:
    uses: zerobias-org/devops/.github/workflows/zbb-publish-reusable.yml@main
    with:
      ghcr-namespace: zerobias-org
      dispatch-input-name: module
      dispatch-input-value: ${{ inputs.module }}
    secrets: inherit
