openapi: 3.0.3
info:
  description: Stub to use for codegen of parameters for a hub client
  version: ''
  title: '@auditmation/hub-client-codegen'
paths:
  /foo:
    get:
      tags:
        - foo
      operationId: getFoo
      responses:
        '204':
          description: Foo
components:
  schemas:
    Parameters:
      type: object
      properties:
        subscriptionIds:
          type: array
          description: >-
            Optional list of Azure subscription IDs to scope collection to.
            When omitted (and managementGroupIds is also omitted) the
            collector runs at tenant scope and collects everything the
            service principal can read.
          items:
            type: string
          example: ['00000000-0000-0000-0000-000000000000']
        managementGroupIds:
          type: array
          description: >-
            Optional list of Azure management group IDs to scope collection
            to. When omitted (and subscriptionIds is also omitted) the
            collector runs at tenant scope.
          items:
            type: string
          example: ['my-management-group']
