openapi: 3.0.3
info:
  title: X12 Collector Parameters
  version: 0.1.0
paths: {}
components:
  schemas:
    Parameters:
      type: object
      properties:
        transactionTypes:
          type: array
          items:
            type: string
            enum:
              - 837P
              - 837I
              - '835'
              - 277CA
              - '999'
          description: Transaction types to drain from the receiver (default all five)
        batchSize:
          type: integer
          description: Transactions leased per ops/take call (default 100, module cap 1000)
          default: 100
        leaseTtl:
          type: string
          description: ISO 8601 lease duration for ops/take (default PT5M)
          default: PT5M
        sourceName:
          type: string
          description: Drain only one watched inbox (the module's source name); default all sources
